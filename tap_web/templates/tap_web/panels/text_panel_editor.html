{# Text Panel editor fields — included inside the outer <form> in panel_edit.html #}

<div>
    <label class="block text-sm font-medium text-slate-700 mb-1" for="{{ form.name.id_for_label }}">
        Name
    </label>
    {% if form.name.errors %}
    <ul class="text-red-600 text-xs mb-1 list-none p-0">
        {% for error in form.name.errors %}<li>{{ error }}</li>{% endfor %}
    </ul>
    {% endif %}
    <input id="{{ form.name.id_for_label }}"
           name="{{ form.name.html_name }}"
           type="text"
           value="{{ form.name.value|default:'' }}"
           maxlength="255"
           class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400 {% if form.name.errors %}border-red-400{% else %}border-slate-300{% endif %}">
</div>

<div>
    <label class="block text-sm font-medium text-slate-700 mb-1" for="{{ form.description.id_for_label }}">
        Description <span class="text-slate-400 font-normal">(admin metadata, not displayed)</span>
    </label>
    <textarea id="{{ form.description.id_for_label }}"
              name="{{ form.description.html_name }}"
              rows="2"
              class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">{{ form.description.value|default:'' }}</textarea>
</div>

<div>
    <label class="block text-sm font-medium text-slate-700 mb-1" for="{{ form.text.id_for_label }}">
        Body Text
    </label>
    <textarea id="{{ form.text.id_for_label }}"
              name="{{ form.text.html_name }}"
              rows="8"
              class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">{{ form.text.value|default:'' }}</textarea>
</div>
