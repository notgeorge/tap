{% extends "tap_web/base.html" %}

<div class="text-center py-16">
    <h1 class="text-2xl font-bold text-slate-700 mb-3">TAP is not yet configured</h1>
    <p class="text-slate-500 mb-6">

    </a>

{% endblock %}
