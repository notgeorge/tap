# TAP ROSCALE plugin — package-mode distribution (namespaced 2026-07-01).
#
# Identity (conformance gate enforces agreement): slug "roscale" ==
# dist "tap-plugin-roscale" == namespace "tap_plugin.roscale" == entry-point key.
# Install-only (no grift seed / no collector): registers the roscale-oscal-workbench
# panel types samsite's compliance pages consume, so it must be installed + loaded
# but is not a `population` seed step. NOT a uv.workspace member (installs via pre-boot).
[project]
name = "tap-plugin-roscale"
description = "TAP ROSCALE plugin — OSCAL Read/Edit presentation layer (workbench + POA&M panels)."
requires-python = ">=3.14"
dynamic = ["version"]
dependencies = []

[project.entry-points."tap.plugins"]
roscale = "tap_plugin.roscale.apps:RoscaleConfig"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# MONOREPO-TRANSITION ARTIFACT — remove on extraction (see fedramp_20x_ksi pyproject).
root = "../.."
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
only-include = ["tap_plugin/roscale"]
