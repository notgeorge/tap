AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  TAP AWS Core collector — cross-account, read-only access role.
  Creates one IAM role that a TAP collector principal may ASSUME (never a
  long-lived key), gated by an External ID, and granted AWS-managed
  SecurityAudit (read-only configuration/metadata; NO data-plane object reads).
  Deleting this stack cleanly removes the role and revokes access.

# ---------------------------------------------------------------------------
# What you are granting (read this before you click Create):
#   * Trust: ONLY the principal in `TrusteePrincipalArn` may assume this role,
#     and ONLY when it presents the exact `ExternalId` below. Nobody else — not
#     even the rest of the trustee's account — can assume it without the ID.
#   * Permissions: AWS-managed `SecurityAudit`. Describe/List/Get on service
#     *configuration* and metadata. It CANNOT read object contents (S3 objects,
#     SQS message bodies, Secrets Manager secret values, etc.).
#   * Revoke anytime: delete this CloudFormation stack.
# ---------------------------------------------------------------------------

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "TAP collector identity (supplied by the TAP operator)"
        Parameters:
          - TrusteePrincipalArn
          - ExternalId
      - Label:
          default: "Role options (defaults are fine)"
        Parameters:
          - RoleName
          - MaxSessionDurationSeconds
    ParameterLabels:
      TrusteePrincipalArn:
        default: "TAP collector principal ARN allowed to assume this role"
      ExternalId:
        default: "External ID the trust policy will require"
      RoleName:
        default: "Name for the created role"
      MaxSessionDurationSeconds:
        default: "Maximum assumed-session lifetime (seconds)"

Parameters:
  TrusteePrincipalArn:
    Type: String
    Description: >-
      The exact IAM principal ARN of the TAP collector, e.g.
      arn:aws:iam::111122223333:user/tap-aws-core-collector. Only this
      principal may assume the created role.
    AllowedPattern: "^arn:aws:iam::[0-9]{12}:(user|role)/.+$"
    ConstraintDescription: >-
      Must be an IAM user or role ARN, e.g.
      arn:aws:iam::111122223333:user/tap-aws-core-collector

  ExternalId:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: >-
      The shared External ID supplied by the TAP operator. The trust policy
      requires this exact value on every AssumeRole call (defeats the
      confused-deputy problem). Do not invent your own — use the value you were
      given.

  RoleName:
    Type: String
    Default: TapAwsCoreCollectorReadOnly
    Description: Name for the created IAM role.
    AllowedPattern: "^[\\w+=,.@-]{1,64}$"

  MaxSessionDurationSeconds:
    Type: Number
    Default: 3600
    MinValue: 900
    MaxValue: 43200
    Description: >-
      Longest lifetime of a single assumed session. 3600 (1 hour) is the
      standard default.

Resources:
  CollectorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: >-
        Read-only cross-account access for the TAP AWS Core collector.
      MaxSessionDuration: !Ref MaxSessionDurationSeconds
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref TrusteePrincipalArn
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                "sts:ExternalId": !Ref ExternalId
      ManagedPolicyArns:
        # Read-only configuration/metadata. To also allow data-plane reads,
        # additionally attach arn:aws:iam::aws:policy/ReadOnlyAccess — only if
        # the TAP operator explicitly asks for it.
        - "arn:aws:iam::aws:policy/SecurityAudit"
      Tags:
        - Key: managed-by
          Value: tap-aws-core
        - Key: purpose
          Value: cross-account-read-only-collector

Outputs:
  RoleArn:
    Description: >-
      SEND THIS BACK to the TAP operator. It goes into the collector's
      aws_assumed_role secret as data.role_arn.
    Value: !GetAtt CollectorRole.Arn
  AccountId:
    Description: >-
      This account's id. Send it back too; it becomes data.expected_account_id
      (the collector asserts it lands here).
    Value: !Ref "AWS::AccountId"
