[project]
name = "tap-plugin-aws-core"
version = "0.1.0"
description = "TAP AWS Core plugin — AWS resource-type models and the boto3 collection engine."
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
