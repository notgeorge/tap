{% load static %}
<div class="tap-panel tap-panel--instance-findings">
{% if instance_findings_error %}
<div class="instance-findings-error">{{ instance_findings_error }}</div>
{% else %}
<div class="instance-findings-header">
    <h2 class="instance-findings-title">Findings</h2>
    <span class="instance-findings-count">{{ instance_findings_count }} open</span>
</div>
<div id="instance-findings-table-{{ panel.entity_id }}"
     class="instance-findings-table"
     data-instance-findings-panel-id="{{ panel.entity_id }}">
</div>
<div id="instance-findings-details-{{ panel.entity_id }}"
     class="instance-findings-details"
     data-instance-findings-details-for="{{ panel.entity_id }}">
</div>
<script type="application/json"
        id="instance-findings-data-{{ panel.entity_id }}">{{ instance_findings_rows_json|safe }}</script>
{% endif %}
</div>
