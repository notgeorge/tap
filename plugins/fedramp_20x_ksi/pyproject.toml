# TAP FedRAMP 20x KSI plugin — package-mode distribution.
#
# The canonical package-mode template (spec-plugin-architecture.md
# req-plugin-arch-identity / -sources / -versioning / -dependencies). The
# plugin-creation skill emits this shape; hand-authored plugins are backstopped by
# the pre-boot conformance gate (tap/preboot.py) that asserts every identity below
# agrees. See docs/misc/doc-plugin-source-identity-deps-handoff.md.
#
# Identity chain (req-plugin-arch-identity — all four MUST agree, gate-enforced):
#   slug             = "fedramp_20x_ksi"                     (tap-plugin.toml slug)
#   distribution     = "tap-plugin-fedramp-20x-ksi"          (PEP 503: slug `_`->`-`, `tap-plugin-` prefix)
#   import namespace = "tap_plugin.fedramp_20x_ksi"          (PEP 420 native namespace; NO tap_plugin/__init__.py)
#   entry-point key  = "fedramp_20x_ksi"                     (== slug)
#
# NOT a `[tool.uv.workspace]` member on purpose: workspace members install via
# `uv sync --all-packages`; a package-mode plugin installs via the pre-boot stage
# from the boot profile's `install` section (req-boot-install-section). That
# separation is the whole point of the refactor.
[project]
name = "tap-plugin-fedramp-20x-ksi"
description = "TAP FedRAMP 20x KSI plugin — KSI catalog, findings, and compliance surfaces for the samsite demo."
requires-python = ">=3.14"
dynamic = ["version"]

# Tier-0 dependencies (req-plugin-arch-dependencies-1): plugin-SPECIFIC third-party
# packages go here so uv resolves the closure at install. fedramp_20x_ksi has NONE:
# its third-party imports (jsonschema, django-simple-history) are core TAP deps the
# host runtime always provides. Plugin-specific deps ride in with the plugins that
# have them (PyYAML->github_core, boto3->aws_core, sigstore->sigstore_core).
dependencies = [
    # Regime-agnostic compliance vocabulary substrate: the compliance_view panel
    # queries compliance_core__compliance_context (req-compliance-core-migration).
    "tap-plugin-compliance-core",
]

[project.entry-points."tap.plugins"]
fedramp_20x_ksi = "tap_plugin.fedramp_20x_ksi.apps:Fedramp20xKsiConfig"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Version = VCS-derived PEP 440 (req-plugin-arch-versioning-1): `{tag}.dev{n}+g{sha}`,
# commit embedded, no hand-maintained version field. hatch-vcs wraps setuptools-scm.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# MONOREPO-TRANSITION ARTIFACT — remove on extraction to a standalone repo.
# The plugin lives at plugins/<slug>/ inside the TAP monorepo, but `.git` is two
# levels up at the repo root. `root` points setuptools-scm there. When this plugin
# is extracted to its own repo (pyproject at the git root), DELETE this override.
root = "../.."
# Until the first `v*` release tag lands on the repo, setuptools-scm cannot derive a
# version; fall back so editable/sdist builds without a reachable tag still succeed.
# Once a release tag exists, hatch-vcs derives the real {tag}.dev{n}+g{sha} — no edit.
fallback_version = "0.0.0"

# PEP 420 namespace build (spike-proven 2026-07-01): `only-include` ships
# tap_plugin/fedramp_20x_ksi/* preserving the tap_plugin/ parent WITHOUT emitting a
# tap_plugin/__init__.py, so sibling plugin dists share the namespace. Non-.py package
# data (tap-plugin.toml, grift/, static/, templates/) is shipped by hatchling by default.
[tool.hatch.build.targets.wheel]
only-include = ["tap_plugin/fedramp_20x_ksi"]
