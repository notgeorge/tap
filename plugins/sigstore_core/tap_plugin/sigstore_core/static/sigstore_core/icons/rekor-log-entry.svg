<?xml version="1.0" encoding="UTF-8"?>
<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <title>Rekor Log Entry</title>
  <!-- Stacked entries (transparency log) with the small Sigstore chevron mark in the corner. -->
  <g>
    <!-- Three log entry rows, alternating Sigstore green/red, with a "verified" tick area on the right. -->
    <rect x="6"  y="8"  width="20" height="4" rx="1" fill="#65A35E"/>
    <rect x="6"  y="14" width="20" height="4" rx="1" fill="#DB6F65"/>
    <rect x="6"  y="20" width="20" height="4" rx="1" fill="#65A35E"/>
    <rect x="6"  y="26" width="20" height="4" rx="1" fill="#DB6F65"/>
    <!-- Mini Sigstore chevron mark, top-right corner. -->
    <polygon points="36,6  30,12 36,12" fill="#65A35E"/>
    <polygon points="36,12 30,12 36,18" fill="#DB6F65"/>
  </g>
</svg>
