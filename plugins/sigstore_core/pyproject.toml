# TAP Sigstore Core plugin — package-mode distribution (namespaced 2026-07-01).
# Identity (conformance gate): slug "sigstore_core" == dist "tap-plugin-sigstore-core"
# == namespace "tap_plugin.sigstore_core" == entry-point key. Migrated OUT of
# [tool.uv.workspace] members; its Tier-0 `sigstore` dep travels with the plugin
# and uv resolves it when the pre-boot stage installs it (req-plugin-arch-dependencies-1).
[project]
name = "tap-plugin-sigstore-core"
description = "TAP Sigstore Core plugin — Rekor / Fulcio models and Sigstore bundle verify+decompose helpers."
requires-python = ">=3.14"
dynamic = ["version"]

# Tier-0: sigstore-ecosystem verification is plugin-specific (not core-provided).
dependencies = [
    "sigstore>=4.2.0",
]

[project.entry-points."tap.plugins"]
sigstore_core = "tap_plugin.sigstore_core.apps:SigstoreCoreConfig"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# MONOREPO-TRANSITION ARTIFACT — remove on extraction (see fedramp_20x_ksi pyproject).
root = "../.."
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
only-include = ["tap_plugin/sigstore_core"]
