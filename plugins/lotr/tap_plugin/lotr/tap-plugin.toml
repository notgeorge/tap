manifest_version = "0"
plugin_version = "0.1.0"
slug = "lotr"
name = "Lord of the Rings"
description = "Middle-earth example plugin — characters, locations, artifacts, races, and factions."

[models]
lotr__character = "tap_plugin.lotr.models.character.Character"
lotr__location = "tap_plugin.lotr.models.location.Location"
lotr__artifact = "tap_plugin.lotr.models.artifact.Artifact"
lotr__race = "tap_plugin.lotr.models.race.Race"
lotr__faction = "tap_plugin.lotr.models.faction.Faction"
lotr__sentinel = "tap_plugin.lotr.models.sentinel.Sentinel"
lotr__citadel = "tap_plugin.lotr.models.citadel.Citadel"
lotr__realm = "tap_plugin.lotr.models.realm.Realm"
lotr__wanderer = "tap_plugin.lotr.models.wanderer.Wanderer"

[edges]
WIELDS__lotr = "edges/WIELDS.edge.json"
LOCATED_IN__lotr = "edges/LOCATED_IN.edge.json"
RULES__lotr = "edges/RULES.edge.json"
BELONGS_TO__lotr = "edges/BELONGS_TO.edge.json"
MEMBER_OF__lotr = "edges/MEMBER_OF.edge.json"
ALLIES_WITH__lotr = "edges/ALLIES_WITH.edge.json"
ENEMIES_WITH__lotr = "edges/ENEMIES_WITH.edge.json"
FORGED_IN__lotr = "edges/FORGED_IN.edge.json"
CONTAINS__lotr = "edges/CONTAINS.edge.json"
REFERENCES__lotr = "edges/REFERENCES.edge.json"
PROTECTS__lotr = "edges/PROTECTS.edge.json"
MENTORS__lotr = "edges/MENTORS.edge.json"

[editors]
character = "tap_plugin.lotr.editors.character.CharacterEditorDescriptor"

[searches]
list-characters-with-bio = "tap_plugin.lotr.searches.characters.list_characters_with_bio"

[grift]
core-data = "grift/core-data.grift.json"
searches = "grift/searches.grift.json"
web = "grift/web.grift.json"
