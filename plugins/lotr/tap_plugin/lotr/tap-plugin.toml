manifest_version = "0"
plugin_version = "0.1.0"
slug = "lotr"
name = "Lord of the Rings"
description = "Middle-earth example plugin — characters, locations, artifacts, races, and factions."

[models]
character = "tap_plugin.lotr.models.character.Character"
location = "tap_plugin.lotr.models.location.Location"
artifact = "tap_plugin.lotr.models.artifact.Artifact"
race = "tap_plugin.lotr.models.race.Race"
faction = "tap_plugin.lotr.models.faction.Faction"
sentinel = "tap_plugin.lotr.models.sentinel.Sentinel"
citadel = "tap_plugin.lotr.models.citadel.Citadel"
realm = "tap_plugin.lotr.models.realm.Realm"
wanderer = "tap_plugin.lotr.models.wanderer.Wanderer"

[edges]
WIELDS = "edges/WIELDS.edge.json"
LOCATED_IN = "edges/LOCATED_IN.edge.json"
RULES = "edges/RULES.edge.json"
BELONGS_TO = "edges/BELONGS_TO.edge.json"
MEMBER_OF = "edges/MEMBER_OF.edge.json"
ALLIES_WITH = "edges/ALLIES_WITH.edge.json"
ENEMIES_WITH = "edges/ENEMIES_WITH.edge.json"
FORGED_IN = "edges/FORGED_IN.edge.json"
CONTAINS = "edges/CONTAINS.edge.json"
REFERENCES = "edges/REFERENCES.edge.json"
PROTECTS = "edges/PROTECTS.edge.json"
MENTORS = "edges/MENTORS.edge.json"

[editors]
character = "tap_plugin.lotr.editors.character.CharacterEditorDescriptor"

[searches]
list-characters-with-bio = "tap_plugin.lotr.searches.characters.list_characters_with_bio"

[grift]
core-data = "grift/core-data.grift.json"
searches = "grift/searches.grift.json"
web = "grift/web.grift.json"
