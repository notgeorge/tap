# TAP administrivia plugin — package-mode distribution (namespaced 2026-07-01).
# Identity (conformance gate): slug "administrivia" == dist "tap-plugin-administrivia" ==
# namespace "tap_plugin.administrivia" == entry-point key. NOT a uv.workspace member.
[project]
name = "tap-plugin-administrivia"
description = "TAP Administrivia plugin — administrative pages, grid landing, and tap_cares administrivia."
requires-python = ">=3.14"
dynamic = ["version"]
dependencies = []

[project.entry-points."tap.plugins"]
administrivia = "tap_plugin.administrivia.apps:AdministriviaConfig"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# MONOREPO-TRANSITION ARTIFACT — remove on extraction (see fedramp_20x_ksi pyproject).
root = "../.."
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
only-include = ["tap_plugin/administrivia"]
