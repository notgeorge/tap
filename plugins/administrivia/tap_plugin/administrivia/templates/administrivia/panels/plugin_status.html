<div class="tap-panel tap-panel--table">
    {# Heading + upper-right quick-filter search box (panel-table.js wires the input by id). #}
    <div class="mb-2 flex items-center justify-between gap-3">
        <h2 class="text-lg font-semibold text-slate-800">
            {{ panel.name }}
            <span class="ml-1 text-sm font-normal text-slate-500">({{ plugin_count }})</span>
        </h2>
        <input type="search"
               id="tap-table-filter-{{ panel.entity_id }}"
               data-tap-table-filter
               placeholder="Filter plugins…"
               aria-label="Filter plugins"
               class="tap-table-filter rounded border border-slate-300 bg-white px-2 py-0.5 text-sm focus:outline-none focus:ring-1 focus:ring-slate-400">
    </div>

    {# Tabulator mount + embedded data/columns payloads (panel-table.js reads these by id). #}
    <div data-tap-table-mount
         data-tap-table-panel-id="{{ panel.entity_id }}"
         id="tap-table-mount-{{ panel.entity_id }}"
         class="tap-table-container"></div>

    <script type="application/json" id="tap-table-data-{{ panel.entity_id }}">{{ table_nodes_json|safe }}</script>
    <script type="application/json" id="tap-table-columns-{{ panel.entity_id }}">{{ table_columns_json|safe }}</script>
</div>
