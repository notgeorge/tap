# TAP gryphon_playground plugin — package-mode distribution (namespaced 2026-07-02).
# Identity (conformance gate): slug "gryphon_playground" == dist "tap-plugin-gryphon-playground" ==
# namespace "tap_plugin.gryphon_playground" == entry-point key. NOT a uv.workspace member.
#
# SPLIT layout: only the runtime plugin package (tap_plugin/gryphon_playground/) ships in the
# wheel. The Gridkin test harness that STAYS at this project dir (gridkin/, tests/, fixtures/,
# scenarios/, expected/, docs/) is test-infra, not plugin code, and is excluded from the wheel
# by only-include below. dependencies = [] — the corpus needs no third-party libs.
[project]
name = "tap-plugin-gryphon-playground"
description = "TAP Gryphon Playground plugin — pg_* playground vocabulary + the Gridkin scenario corpus."
requires-python = ">=3.14"
dynamic = ["version"]
dependencies = []

[project.entry-points."tap.plugins"]
gryphon_playground = "tap_plugin.gryphon_playground.apps:GryphonPlaygroundConfig"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# MONOREPO-TRANSITION ARTIFACT — remove on extraction (see fedramp_20x_ksi pyproject).
root = "../.."
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
only-include = ["tap_plugin/gryphon_playground"]
