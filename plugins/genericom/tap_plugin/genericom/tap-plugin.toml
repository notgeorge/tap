manifest_version = "0"
plugin_version = "0.1.0"
slug = "genericom"
name = "Genericom"
description = "Demonstration AWS environment — a fictional customer-facing web application stack used to exercise TAP visualization, pan, zoom, and future alert-badge features."

[grift]
dimension = "grift/dimension.grift.json"
account = "grift/account.grift.json"
network = "grift/network.grift.json"
dns = "grift/dns.grift.json"
web = "grift/web.grift.json"
data = "grift/data.grift.json"
cache = "grift/cache.grift.json"
pages = "grift/pages.grift.json"
pages-status-badges = "grift/pages-status-badges.grift.json"
pages-info-window = "grift/pages-info-window.grift.json"
pages-status-badges-passing = "grift/pages-status-badges-passing.grift.json"
pages-finding-strip = "grift/pages-finding-strip.grift.json"
ec2-internals = "grift/ec2-internals.grift.json"
ec2-instance-page = "grift/ec2-instance-page.grift.json"
ec2-instance-page-v030 = "grift/ec2-instance-page-v030.grift.json"
ec2-arrangements = "grift/ec2-arrangements.grift.json"
open-alerts = "grift/open-alerts.grift.json"
compliance-context-fedramp = "grift/compliance-context-fedramp.grift.json"
# fedramp_20x_ksi findings against genericom EC2/DNS assets. These bundles
# create fedramp_20x_ksi `finding` nodes plus HAS_FINDING edges from genericom
# asset entities and RELATED_INDICATOR edges to fedramp_20x_ksi ksi_indicator
# entities. They live here (not in fedramp_20x_ksi) because their from-side
# endpoints are genericom-owned; the bundles are dead weight without genericom
# loaded. Revival note: if reactivating genericom, place its INSTALLED_APPS
# line AFTER `fedramp_20x_ksi` so the ksi_indicator targets exist when these
# bundles import — otherwise the RELATED_INDICATOR edges dangle on the to-side.
findings-genericom = "grift/findings-genericom.grift.json"
findings-genericom-passing = "grift/findings-genericom-passing.grift.json"
