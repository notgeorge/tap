# TAP Genericom plugin — package-mode distribution (namespaced 2026-07-01).
#
# Re-pointed from the install-MVP's top-level `genericom` import to the canonical
# PEP 420 namespace `tap_plugin.genericom` (req-plugin-arch-identity-3). The identity
# chain the pre-boot conformance gate enforces:
#   slug             = "genericom"
#   distribution     = "tap-plugin-genericom"
#   import namespace = "tap_plugin.genericom"     (NO tap_plugin/__init__.py — PEP 420)
#   entry-point key  = "genericom"                (== slug)
#
# genericom is a demonstration plugin (grift-only, no models); it is installed only by
# boot/genericom-install.boot.json, not the samsite profile. NOT a uv.workspace member:
# package-mode plugins install via the pre-boot stage, not `uv sync --all-packages`.
[project]
name = "tap-plugin-genericom"
description = "TAP Genericom plugin — demonstration AWS environment for visualization work."
requires-python = ">=3.14"
dynamic = ["version"]
dependencies = []

[project.entry-points."tap.plugins"]
genericom = "tap_plugin.genericom.apps:GenericomConfig"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# VCS-derived PEP 440 version (req-plugin-arch-versioning-1); no hand-maintained field.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# MONOREPO-TRANSITION ARTIFACT — remove on extraction (see fedramp_20x_ksi pyproject).
root = "../.."
fallback_version = "0.0.0"

# PEP 420 namespace build: ship tap_plugin/genericom/* preserving the tap_plugin/
# parent WITHOUT a tap_plugin/__init__.py. Package data (tap-plugin.toml, grift/,
# static/, templates/) is shipped by hatchling by default.
[tool.hatch.build.targets.wheel]
only-include = ["tap_plugin/genericom"]
