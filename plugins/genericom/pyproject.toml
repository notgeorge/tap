# TAP Genericom plugin — package-mode (spec-plugin-architecture req-plugin-arch-install-registry).
#
# The first plugin migrated to package mode: a wheel-buildable distribution with a
# `tap.plugins` entry point whose key EQUALS the slug. Django discovers it via
# importlib.metadata.entry_points() (no hardcoded plugins.<slug> path, no plugins/<slug>
# source layout). The importable package is the top-level `genericom/` dir here; all
# runtime data (tap-plugin.toml, grift/, static/, templates/, panels/) lives inside it so
# hatchling ships it by default. specs/ and tests/ sit OUTSIDE the package and are not shipped.
#
# NOT a uv.workspace member on purpose: workspace members are installed by `uv sync
# --all-packages`; a package-mode plugin is installed by the pre-boot stage from the boot
# profile's `install` section (req-boot-install-section), which is the whole point.
#
# See docs/misc/doc-plugin-boot-install-handoff.md "Package-mode recipe — PROVEN".
[project]
name = "tap-plugin-genericom"
version = "0.1.0"
description = "TAP Genericom plugin — demonstration AWS environment for visualization work."
requires-python = ">=3.14"

[project.entry-points."tap.plugins"]
genericom = "genericom.apps:GenericomConfig"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["genericom"]
