{% load static %}
<div class="tap-panel tap-panel--genericom-open-alerts">
    {% include "tap_web/panel_header.html" %}

    {% if open_alerts_error %}
    <div class="tap-panel-error rounded border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
        {{ open_alerts_error }}
    </div>
    {% else %}

    <div class="genericom-open-alerts-meta">
        <span class="genericom-open-alerts-count">{{ open_alerts_count }} open finding{{ open_alerts_count|pluralize }}</span>
    </div>

    <div id="genericom-open-alerts-table-{{ panel.entity_id }}"
         data-genericom-open-alerts-panel-id="{{ panel.entity_id }}"
         class="genericom-open-alerts-table-container"></div>

    <script type="application/json"
            id="genericom-open-alerts-data-{{ panel.entity_id }}">{{ open_alerts_rows_json|safe }}</script>

    {% endif %}
</div>
