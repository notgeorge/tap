# TAP identity_core plugin — package-mode distribution.
# Identity (conformance gate): slug "identity_core" == dist "tap-plugin-identity-core" ==
# namespace "tap_plugin.identity_core" == entry-point key. NOT a uv.workspace member.
# Cross-cutting identity vocabulary substrate (oidc_issuer); github_core/aws_core/
# sigstore_core/samsite depend on it downward. Spec: plugins/identity_core/specs/spec-identity-core-v0.md.
[project]
name = "tap-plugin-identity-core"
description = "TAP Identity Core plugin — cross-cutting federated-identity vocabulary (OIDC issuer) + issuer convergence primitives."
requires-python = ">=3.14"
dynamic = ["version"]
dependencies = []

[project.entry-points."tap.plugins"]
identity_core = "tap_plugin.identity_core.apps:IdentityCoreConfig"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# MONOREPO-TRANSITION ARTIFACT — remove on extraction (see fedramp_20x_ksi pyproject).
root = "../.."
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
only-include = ["tap_plugin/identity_core"]
