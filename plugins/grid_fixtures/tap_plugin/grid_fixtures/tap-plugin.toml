manifest_version = "0"
plugin_version = "0.1.0"
slug = "grid_fixtures"
name = "Grid Fixtures"
description = "Neutral core-test node + edge vocabulary — query-pattern nodes (pg_*) plus edge-constraint archetype nodes and typed/constrained edges the core suites import."

[models]
# Query-pattern nodes (unconstrained, full scalar surface) — Gryphon executor testing.
grid_fixtures__node = "tap_plugin.grid_fixtures.models.pg_node.PgNode"
grid_fixtures__hub = "tap_plugin.grid_fixtures.models.pg_hub.PgHub"
grid_fixtures__leaf = "tap_plugin.grid_fixtures.models.pg_leaf.PgLeaf"
grid_fixtures__cycle_node = "tap_plugin.grid_fixtures.models.pg_cycle_node.PgCycleNode"
# Constraint-archetype nodes — grid edge-constraint validation testing.
grid_fixtures__unconstrained = "tap_plugin.grid_fixtures.models.unconstrained.Unconstrained"
grid_fixtures__constrained_source = "tap_plugin.grid_fixtures.models.constrained_source.ConstrainedSource"
grid_fixtures__constrained_target = "tap_plugin.grid_fixtures.models.constrained_target.ConstrainedTarget"
grid_fixtures__dual_endpoint = "tap_plugin.grid_fixtures.models.dual_endpoint.DualEndpoint"
grid_fixtures__peer_group = "tap_plugin.grid_fixtures.models.peer_group.PeerGroup"
grid_fixtures__outbound_blocked = "tap_plugin.grid_fixtures.models.outbound_blocked.OutboundBlocked"
grid_fixtures__inbound_blocked = "tap_plugin.grid_fixtures.models.inbound_blocked.InboundBlocked"
grid_fixtures__nesting_container = "tap_plugin.grid_fixtures.models.nesting_container.NestingContainer"
grid_fixtures__wildcard_referencer = "tap_plugin.grid_fixtures.models.wildcard_referencer.WildcardReferencer"

[edges]
# Wildcard query-pattern edges (Gryphon executor testing).
PG_LINKS__grid_fixtures = "edges/PG_LINKS.edge.json"
PG_NESTS__grid_fixtures = "edges/PG_NESTS.edge.json"
PG_LOOPS__grid_fixtures = "edges/PG_LOOPS.edge.json"
PG_OPTIONAL__grid_fixtures = "edges/PG_OPTIONAL.edge.json"
# Typed / constrained / schema-bearing edges (edge-constraint validation testing).
CONSTRAINED_LINK__grid_fixtures = "edges/CONSTRAINED_LINK.edge.json"
ALT_LINK__grid_fixtures = "edges/ALT_LINK.edge.json"
SCHEMA_LINK__grid_fixtures = "edges/SCHEMA_LINK.edge.json"
REQUIRED_SCHEMA_LINK__grid_fixtures = "edges/REQUIRED_SCHEMA_LINK.edge.json"
REVERSE_CONSTRAINED_LINK__grid_fixtures = "edges/REVERSE_CONSTRAINED_LINK.edge.json"
SYMMETRIC_LINK__grid_fixtures = "edges/SYMMETRIC_LINK.edge.json"
RIVAL_LINK__grid_fixtures = "edges/RIVAL_LINK.edge.json"
CATEGORY_LINK__grid_fixtures = "edges/CATEGORY_LINK.edge.json"
MEMBER_LINK__grid_fixtures = "edges/MEMBER_LINK.edge.json"
GUARD_LINK__grid_fixtures = "edges/GUARD_LINK.edge.json"
NESTING_LINK__grid_fixtures = "edges/NESTING_LINK.edge.json"
WILDCARD_LINK__grid_fixtures = "edges/WILDCARD_LINK.edge.json"
