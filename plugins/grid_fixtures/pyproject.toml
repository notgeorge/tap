# TAP grid_fixtures plugin — package-mode distribution.
#
# Identity chain (req-plugin-arch-identity — all four MUST agree, gate-enforced):
#   slug             = "grid_fixtures"               (tap-plugin.toml slug)
#   distribution     = "tap-plugin-grid-fixtures"    (PEP 503: slug `_`->`-`, `tap-plugin-` prefix)
#   import namespace = "tap_plugin.grid_fixtures"    (PEP 420 native namespace; NO tap_plugin/__init__.py)
#   entry-point key  = "grid_fixtures"               (== slug)
#
# grid_fixtures is the neutral, load-bearing test-fixture vocabulary the core
# tap_grid/tap_api constraint/edge/validation + Gryphon suites import (the role lotr
# has historically filled). It ships ONLY the four pg_* node models + four PG_* edge
# defs — no corpus, no harness. The Gridkin scenario corpus that exercises this
# vocabulary lives in the gryphon_playground plugin, which depends on this one.
# Like every plugin, it migrates to package-mode: the pre-boot stage installs it
# (editable) from a boot profile's `install` section, and the test settings'
# entry-point discovery-fallback makes it importable to pytest.
[project]
name = "tap-plugin-grid-fixtures"
description = "TAP grid_fixtures plugin — neutral, unconstrained graph-node + edge vocabulary for grid test fixtures."
requires-python = ">=3.14"
dynamic = ["version"]

# Tier-0 dependencies (req-plugin-arch-dependencies-1): NONE. grid_fixtures imports
# only the core TAP runtime (tap_grid, tap_plugins.base) the host always provides.
dependencies = []

[project.entry-points."tap.plugins"]
grid_fixtures = "tap_plugin.grid_fixtures.apps:GridFixturesConfig"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# MONOREPO-TRANSITION ARTIFACT — remove on extraction (see fedramp_20x_ksi pyproject).
root = "../.."
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
only-include = ["tap_plugin/grid_fixtures"]
