manifest_version = "0"
plugin_version = "0.1.0"
slug = "github_core"
name = "TAP GitHub Core"
description = "GitHub Actions deployment plumbing models for samsite — workflows, runs, jobs, runners."

depends_on = [
    { slug = "identity_core", note = "ENABLED_ON sources the identity_core__oidc_issuer type; the collector mints the issuer node via identity_core.issuer (the OIDC vocabulary lives there, not here)." },
]

[models]
github_core__github_platform = "tap_plugin.github_core.models.github_platform.GithubPlatform"
github_core__github_account = "tap_plugin.github_core.models.github_account.GithubAccount"
github_core__github_repository = "tap_plugin.github_core.models.github_repository.GithubRepository"
github_core__github_workflow = "tap_plugin.github_core.models.github_workflow.GithubWorkflow"
github_core__github_actions_run = "tap_plugin.github_core.models.github_actions_run.GithubActionsRun"
github_core__github_actions_job = "tap_plugin.github_core.models.github_actions_job.GithubActionsJob"
github_core__github_runner = "tap_plugin.github_core.models.github_runner.GithubRunner"
github_core__github_app = "tap_plugin.github_core.models.github_app.GithubApp"

[edges]
HOSTS_ACCOUNT__github_core = "edges/HOSTS_ACCOUNT.edge.json"
ENABLED_ON__github_core = "edges/ENABLED_ON.edge.json"
OWNS_REPO__github_core = "edges/OWNS_REPO.edge.json"
DEFINES_WORKFLOW__github_core = "edges/DEFINES_WORKFLOW.edge.json"
EXECUTES_WORKFLOW__github_core = "edges/EXECUTES_WORKFLOW.edge.json"
HAS_ACTIONS_JOB__github_core = "edges/HAS_ACTIONS_JOB.edge.json"
EXECUTED_ON__github_core = "edges/EXECUTED_ON.edge.json"
REFERENCES_RESOURCE__github_core = "edges/REFERENCES_RESOURCE.edge.json"
FEDERATES_VIA__github_core = "edges/FEDERATES_VIA.edge.json"

[grift]
repo-landing-page = "grift/repo-landing-page.grift.json"
