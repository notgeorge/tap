manifest_version = "0"
plugin_version = "0.1.0"
slug = "github_core"
name = "TAP GitHub Core"
description = "GitHub Actions deployment plumbing models for samsite — workflows, runs, jobs, runners."

[models]
github_platform = "tap_plugin.github_core.models.github_platform.GithubPlatform"
oidc_issuer = "tap_plugin.github_core.models.oidc_issuer.OidcIssuer"
github_account = "tap_plugin.github_core.models.github_account.GithubAccount"
github_repository = "tap_plugin.github_core.models.github_repository.GithubRepository"
github_workflow = "tap_plugin.github_core.models.github_workflow.GithubWorkflow"
github_actions_run = "tap_plugin.github_core.models.github_actions_run.GithubActionsRun"
github_actions_job = "tap_plugin.github_core.models.github_actions_job.GithubActionsJob"
github_runner = "tap_plugin.github_core.models.github_runner.GithubRunner"
github_app = "tap_plugin.github_core.models.github_app.GithubApp"

[edges]
HOSTS_ACCOUNT = "edges/HOSTS_ACCOUNT.edge.json"
ENABLED_ON = "edges/ENABLED_ON.edge.json"
OWNS_REPO = "edges/OWNS_REPO.edge.json"
DEFINES_WORKFLOW = "edges/DEFINES_WORKFLOW.edge.json"
EXECUTES_WORKFLOW = "edges/EXECUTES_WORKFLOW.edge.json"
HAS_ACTIONS_JOB = "edges/HAS_ACTIONS_JOB.edge.json"
EXECUTED_ON = "edges/EXECUTED_ON.edge.json"
REFERENCES_RESOURCE = "edges/REFERENCES_RESOURCE.edge.json"
FEDERATES_VIA = "edges/FEDERATES_VIA.edge.json"
TRUSTS_ISSUER = "edges/TRUSTS_ISSUER.edge.json"

[grift]
repo-landing-page = "grift/repo-landing-page.grift.json"
