# TAP computing_core plugin — package-mode distribution (namespaced 2026-07-01).
# Identity (conformance gate): slug "computing_core" == dist "tap-plugin-computing-core" ==
# namespace "tap_plugin.computing_core" == entry-point key. NOT a uv.workspace member.
[project]
name = "tap-plugin-computing-core"
description = "TAP Computing Core plugin — vendor-neutral computing-primitive dimension."
requires-python = ">=3.14"
dynamic = ["version"]
dependencies = []

[project.entry-points."tap.plugins"]
computing_core = "tap_plugin.computing_core.apps:ComputingCoreConfig"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# MONOREPO-TRANSITION ARTIFACT — remove on extraction (see fedramp_20x_ksi pyproject).
root = "../.."
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
only-include = ["tap_plugin/computing_core"]
