manifest_version = "0"
plugin_version = "0.1.0"
slug = "computing_core"
name = "TAP Computing Core"
description = "Vendor-neutral primitives for modern computing systems: interfaces, addresses, ports, connections, programs, and files."

[models]
network_interface = "plugins.computing_core.models.network_interface.NetworkInterface"
ip_address = "plugins.computing_core.models.ip_address.IpAddress"
port = "plugins.computing_core.models.port.Port"
tcp_connection = "plugins.computing_core.models.tcp_connection.TcpConnection"
program = "plugins.computing_core.models.program.Program"
file = "plugins.computing_core.models.file.File"
public_key = "plugins.computing_core.models.public_key.PublicKey"
private_key = "plugins.computing_core.models.private_key.PrivateKey"
user = "plugins.computing_core.models.user.User"

[edges]
HOSTS = "edges/HOSTS.edge.json"
RUNS_ON = "edges/RUNS_ON.edge.json"
HAS_IP = "edges/HAS_IP.edge.json"
AVAILABLE_AT = "edges/AVAILABLE_AT.edge.json"
LISTENS_ON = "edges/LISTENS_ON.edge.json"
CONNECTS_TO = "edges/CONNECTS_TO.edge.json"
PAIRED_WITH = "edges/PAIRED_WITH.edge.json"
GENERATES_FILE = "edges/GENERATES_FILE.edge.json"

[grift]
dimension = "grift/dimension.grift.json"
