{% extends "tap_web/base.html" %}
{% load static %}

{% block title %}{{ layout.name }} - TAP{% endblock %}

{% block content %}
<div class="mb-4">
    <h1 class="text-2xl font-bold text-slate-800">{{ layout.name }}</h1>
    {% if layout.description %}
    <p class="mt-1 text-slate-600">{{ layout.description }}</p>
    {% endif %}
</div>

<div id="cy" class="w-full h-96 border border-slate-300 rounded-lg bg-white"></div>

<script src="{% static 'tap_viz/js/cytoscape.min.js' %}"></script>
<script src="{% static 'tap_viz/js/cytoscape-grid-guide.js' %}"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const config = {{ layout.cytoscape_config|safe }};
    const cy = cytoscape({
        container: document.getElementById('cy'),
        elements: config.elements || [],
        style: config.style || [
            {
                selector: 'node',
                style: {
                    'background-color': '#4f46e5',
                    'label': 'data(label)',
                    'color': '#1e293b',
                    'font-size': '12px'
                }
            },
            {
                selector: 'edge',
                style: {
                    'width': 2,
                    'line-color': '#94a3b8',
                    'target-arrow-color': '#94a3b8',
                    'target-arrow-shape': 'triangle',
                    'curve-style': 'bezier'
                }
            }
        ],
        layout: config.layout || { name: 'preset' },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        boxSelectionEnabled: false
    });
});
</script>
{% endblock %}
