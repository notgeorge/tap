# All-plugins validation lane (v1).
#
# The blocking authority for the FULL plugin set that a focused local stack can no
# longer run once plugins leave the monorepo. Reciprocal of the local promote gate:
# local validates what's installed in this stack; this lane owns all-plugins truth.
# spec-dev-validation.md req-dev-validation-all-plugins-lane (+ Validation Map row).
#
# STAGING
#   v1 (this file): boots the `test_all` union from the MONOREPO checkout — every
#     plugin source is still retained in-tree (editable) — and runs the full pytest
#     lane in a real compose stack. Proves the CI infra + all-plugins coverage NOW,
#     before any re-release, so the monorepo copies can be deleted only once green.
#   v2 (after re-release / expulsion): switch plugin sources to git-installed
#     test-carrying wheels (github-plugins-ro) so the lane still covers plugins that
#     have left the monorepo — the git-sourced test_all record.
#
# OPEN (two-mains model — spec-dev-validation-all-plugins-lane sub-reqs 3-5):
#   - promote-to-main blocks on this run (option B: workflow_dispatch + poll) — the
#     `push:` trigger below is a VALIDATION-PHASE scaffold to iterate the pipeline;
#     narrow to workflow_dispatch + pull_request once the lane is green.
#   - cold-boot / lean-boot gates (they spawn extra stacks) folded in after a first
#     green run confirms Docker-in-Actions behaviour.

name: all-plugins

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
  push:
    # VALIDATION PHASE ONLY — run on this session's pushes so the pipeline can be
    # iterated to green. Remove/narrow once promote-wiring (option B) lands.
    branches: [session/plugins]

concurrency:
  group: all-plugins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  all-plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # `test_all` fires no collectors and the secret loader no-ops on an empty
      # secrets root (only required_for_boot=true secrets block), so an empty dir is
      # enough to boot. Replace the host symlink (tap_secrets -> ~/tap-secrets, a
      # broken link on a runner) with an empty dir the compose bind-mount can use.
      - name: Provide empty secrets root
        run: |
          rm -f tap_secrets
          mkdir -p tap_secrets

      - name: Build web image
        run: docker compose --env-file .env build web

      # Entrypoint chain: uv sync --all-packages -> pre-boot (installs the test_all
      # plugin union editable, emits TAP_PLUGINS) -> migrate -> runserver. Readiness
      # is `manage.py health` (the documented gate) — retried while boot proceeds;
      # fast-fail on the reserved TAP-ABORT sentinel.
      - name: Boot the test_all union
        env:
          TAP_BOOT_PROFILE: test_all
          TAP_BOOT_INSTALL__SNAPSHOT_BEFORE_MIGRATE: "false"
        run: |
          docker compose --env-file .env up -d
          ok=0
          for i in $(seq 1 90); do
            if docker compose --env-file .env logs web 2>/dev/null | grep -q 'TAP-ABORT:'; then
              echo "::error::boot aborted (TAP-ABORT sentinel in web log)"
              docker compose --env-file .env logs web; exit 1
            fi
            if docker compose --env-file .env exec -T web sh -c 'cd /app && uv run python manage.py health' >/dev/null 2>&1; then
              echo "web healthy after ~$((i * 10))s"; ok=1; break
            fi
            sleep 10
          done
          if [ "$ok" != 1 ]; then
            echo "::error::web did not become healthy within the timeout"
            docker compose --env-file .env logs web | tail -150; exit 1
          fi

      # The full lane INCLUDING the gryphon corpus (no --ignore) — the all-plugins
      # authority. pytest collects every installed plugin's in-package tests
      # (tap.plugin_testing) alongside the core walk. `-n auto` matches scripts/test.
      - name: Full test lane (all plugins)
        run: docker compose --env-file .env exec -T web sh -c 'cd /app && uv run pytest -n auto'

      - name: Dump web logs on failure
        if: failure()
        run: docker compose --env-file .env logs web | tail -200
