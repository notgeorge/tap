# Publish the built tap-web / tap-db images to GHCR on every main push
# (req-cicd-build-once-artifact — registry decision: GHCR for the public dev/CI
# artifact; ECR Public remains the base-image mirror).
#
# Consumers:
#   * scripts/spawn-session.sh + scripts/stand-up.sh pull these instead of
#     building (docker-compose.yml image: fields) — anonymous, no credential.
#   * CI lanes borrow the :buildcache-<arch> refs via cache-from so a GHA-cache
#     miss falls back to registry layers instead of a full rebuild.
#
# Architecture: one native build per arch (amd64 on ubuntu-latest, arm64 on the
# free-for-public-repos arm runners — QEMU would crawl through the OpenSSL FIPS
# + cryptography compiles), pushed as :staging-<sha>-<arch>, then merged into
# the multi-arch :sha-<short> (+ :latest for tip builds) manifests and attested
# (SLSA provenance via the Sigstore public-good instance; verify with
#   gh attestation verify oci://ghcr.io/unified-systems-com/tap-web:latest --owner unified-systems-com).
# Staging tags are per-commit ON PURPOSE: isolated runs (below) mean two
# publishes can overlap, and a shared staging tag would let the merge step pair
# mismatched arches. They accumulate in the registry; do NOT delete them — the
# multi-arch index references those manifests by digest.
#
# Backfill (workflow_dispatch `ref`): builds that commit and publishes ONLY its
# :sha-<short> manifest, never moving :latest. This is the recovery path for a
# release commit whose main-push build was superseded before publishing — see
# publish-release-tags.yml.
#
# Runs OFF the promote critical path: promote pushes main and moves on; this
# fires behind it. Only TAP_FIPS=1 (the published posture) is built.
name: publish-images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Backfill: full 40-hex commit SHA (on main) to build. Publishes
          :sha-<short> only — :latest does not move. Leave empty to build
          main's tip and move :latest (the normal recovery dispatch).
        required: false
        default: ""

# Superseded publishes just waste runners — newest main wins — EXCEPT for runs
# whose :sha-<short> manifest is a release contract surface: a release-please
# release commit (publish-release-tags.yml promotes its sha manifest to the
# versioned tag; cancelling it is exactly the v0.1.2 gap) and explicit ref
# backfills. Those get an isolated group so later main pushes cannot cancel
# them. Transient: a slow release build finishing after a newer tip build
# leaves :latest one release behind until the next push — harmless, and the
# alternative (cancelling the release build) broke versioned tags for real.
concurrency:
  group: "publish-images-${{ ((github.event_name == 'workflow_dispatch' && inputs.ref != '') || startsWith(github.event.head_commit.message, 'chore(main): release')) && github.run_id || 'main' }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  OWNER: unified-systems-com
  # The commit being built. For push events and empty-ref dispatches this is
  # the triggering sha; for backfills it is the operator-supplied commit.
  BUILD_SHA: ${{ inputs.ref || github.sha }}
  # Tip builds move :latest; ref backfills never do.
  TAG_LATEST: ${{ inputs.ref == '' }}

jobs:
  build:
    name: build ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [tap-web, tap-db]
        arch: [amd64, arm64]
        include:
          - image: tap-web
            dockerfile: Dockerfile
          - image: tap-db
            dockerfile: docker/postgres/Dockerfile
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Validate backfill ref
        if: inputs.ref != ''
        run: |
          if ! [[ "$BUILD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ref input must be a full 40-hex commit SHA (got: ${BUILD_SHA})"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BUILD_SHA }}
          persist-credentials: false  # build needs the tree, not a token in .git config
      # guard-allow: req-cicd-runner-least-privilege — the docker/* steps ARE the write this
      # job exists for (verified-creator tier); nothing else shares the job's packages:write.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:staging-${{ env.BUILD_SHA }}-${{ matrix.arch }}
          build-args: |
            TAP_FIPS=1
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:buildcache-${{ matrix.arch }},mode=max

  manifest:
    name: manifest + attest ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        image: [tap-web, tap-db]
    steps:
      # guard-allow: req-cicd-runner-least-privilege — the registry login IS this job's
      # write path (manifest push + attestation); nothing else third-party shares the job.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge per-arch images into multi-arch tags
        id: merge
        run: |
          ref="${REGISTRY}/${OWNER}/${{ matrix.image }}"
          short="${BUILD_SHA:0:7}"
          tags=(-t "${ref}:sha-${short}")
          if [ "$TAG_LATEST" = "true" ]; then
            tags+=(-t "${ref}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "${ref}:staging-${BUILD_SHA}-amd64" "${ref}:staging-${BUILD_SHA}-arm64"
          digest="$(docker buildx imagetools inspect "${ref}:sha-${short}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

  # Trivy scan of the just-published image (req-cicd-security-scanning-4 /
  # req-cicd-base-image-lifecycle-2). REPORT-ONLY for now: findings land as SARIF
  # in code scanning (Security tab), never blocking the publish. The planned gate
  # tightening (fail on High/Critical WITH a fix available, after a week of
  # signal) belongs pre-push in the build legs — this job stays the reporting
  # layer. Waivers: .trivyignore, every entry with a mandatory reason comment
  # (the operator-waives discipline; see spec-cicd-hardening.md). The nightly
  # sweep of :latest lives in trivy-nightly.yml (new CVEs land against images
  # that haven't changed). One scan covers OS packages AND the Python closure —
  # the deps-warm wheel cache means the scanned artifact carries both.
  # Scans :sha-<short> (the manifest this run just published) rather than
  # :latest, which a backfill run does not move.
  scan:
    name: trivy scan ${{ matrix.image }}
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [tap-web, tap-db]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7   # for .trivyignore
        with:
          ref: ${{ env.BUILD_SHA }}
          persist-credentials: false  # never leave the job token readable in .git config
      - name: Resolve published tag
        id: meta
        run: echo "short=${BUILD_SHA:0:7}" >> "$GITHUB_OUTPUT"
      # guard-allow: req-cicd-runner-least-privilege — scanner needs no token; this job's
      # only write scope is security-events, consumed by the first-party SARIF upload step.
      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:sha-${{ steps.meta.outputs.short }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          exit-code: "0"   # report-only — the gate flip changes this pre-push, not here
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}
