# Per-product-line CI lanes (spec-dev-validation.md req-dev-validation-product-line-lanes).
#
# Each product line is a boot profile validated on its OWN AWS CodeBuild GitHub Actions
# runner (provisioned by ci/terraform/codebuild-runners/). The lane boots that line's
# profile, clones a per-profile pre-migrated template DB (fast + race-free setup, see
# TAP_TEST_DB_TEMPLATE / scripts/build-test-template), and runs that line's tests. Lines
# run in parallel; parallelism is along the meaningful product axis, not arbitrary shards.
#
# Runner label: `codebuild-<project>-<run_id>-<run_attempt>` where <project> is
# `tap-ci-<line>` (Terraform `runner_labels` output). Adding a line = add a matrix entry
# here AND a `product_lines` entry in the Terraform.
#
# PROMOTE GATE: the `test_all` union lane here is the promote gate — promote-to-main.sh
# Step 2.6 dispatches `line=test_all` and blocks the atomic push on red (option B,
# req-dev-validation-product-line-lanes-6). The free-runner all-plugins.yml lane is
# retained as the fallback (TAP_PROMOTE_CI_WORKFLOW=all-plugins.yml) for when CodeBuild
# is unavailable.

name: product-lines

on:
  workflow_dispatch:
    inputs:
      line:
        description: "Lane to run on dispatch. 'all' runs every lane; a single lane runs just that one. PR events always run all lanes."
        type: choice
        options: [test_all, samsite, all]
        default: test_all
  pull_request:
    branches: [main]

# Explicit least-privilege GITHUB_TOKEN (org default is read-only; stated here so the
# file is self-describing and CodeQL's missing-workflow-permissions check passes).
permissions:
  contents: read

concurrency:
  group: product-lines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pick the lane set. On dispatch, run only the selected lane (default test_all); a
  # 'line=all' dispatch and every PR run all lanes. The matrix context is not available
  # in a job-level if, so we compute the matrix here and feed it in via fromJSON.
  # NOTE: since 2026-08-08 every plugin repo is PUBLIC on unified-systems-com, so both
  # lanes git-install anonymously — no credential, no Secrets Manager round-trip. The
  # plugin-pull machinery (routing manifest + provider preinstall + ambient-creds export,
  # driven by a needs_plugin_pull matrix flag) was removed here the same day; a fork that
  # installs PRIVATE plugins wants it back — see req-plugin-arch-source-secret-5 and this
  # file's git history at a73c62b9 for the worked example.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          LINE: ${{ github.event.inputs.line }}
        run: |
          test_all='{"line":"test_all","profile":"test_all"}'
          samsite='{"line":"samsite","profile":"samsite"}'
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$LINE" != "all" ]; then
            case "$LINE" in
              test_all) inc="$test_all" ;;
              samsite)  inc="$samsite" ;;
              *) echo "::error::unknown line '$LINE'"; exit 1 ;;
            esac
          else
            inc="$test_all,$samsite"
          fi
          echo "matrix={\"include\":[$inc]}" >> "$GITHUB_OUTPUT"

  # Broad credential scan — the complement to the in-repo `secret-pattern` guard
  # (req-tap-cares-secrets-credential-patterns). The guard is exact and always-on over six
  # shapes; this covers the ~100 provider patterns it does not. Empirically NOT redundant:
  # on 2026-07-22 gitleaks caught a planted Stripe token the guard has no pattern for, and
  # MISSED a planted AWS access key id the guard catches. Both layers, or neither is honest.
  #
  # Runs the GATE profile (.gitleaks.toml — entropy rules off; see that file for the 21
  # findings / 21 false positives measurement that justifies it). The full ruleset belongs
  # to the human-triaged pre-publication history audit (req-tap-cares-secrets-history-audit),
  # not here.
  #
  # Installed from the GitHub release rather than the Docker Hub image, deliberately:
  # anonymous Docker Hub pulls chronically 429'd and redded this gate
  # (req-cicd-base-image-sourcing). The release tarball comes from the same host the runner
  # already talks to. Version pinned — an auto-updating scanner is an unreviewed change to
  # what "green" means.
  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The gate scans the tree, not history — but a shallow clone also breaks the
          # `git`-mode fallback, so keep full history available for manual re-runs.
          fetch-depth: 0
      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan working tree (gate profile)
        run: |
          # --redact so a true positive is not re-disclosed in a public CI log.
          gitleaks dir . --config .gitleaks.toml --no-banner --redact --exit-code 1

  line:
    # secret-scan gates the expensive lanes: it is ~30s, the CodeBuild lanes are ~25min,
    # and there is no value in testing a tree that is leaking a credential.
    needs: [setup, secret-scan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    # CodeBuild GHA-runner label. Project name = tap-ci-<line> (Terraform name_prefix).
    runs-on: codebuild-tap-ci-${{ matrix.line }}-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 40
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      # Name of the per-worker clone-source template built below (in-container).
      TAP_TEST_DB_TEMPLATE: tap_test_template
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Provide empty secrets root
        run: |
          rm -f tap_secrets
          mkdir -p tap_secrets

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build web image (GHA layer cache)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: tap-web:ci
          # gha first (fast, same-day hits); the registry ref (published by
          # publish-images.yml) catches GHA-cache eviction and day-one misses.
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/unified-systems-com/tap-web:buildcache-amd64
          cache-to: type=gha,mode=max

      # The samsite record ships inside tap-plugin-samsite (req-boot-bootstrap-samsite-rehome);
      # the lane fetches it by the same pointer operators use — one copy, no lane-local fork
      # (rehome-5). Staged into boot/ it is thereafter an ordinary local profile. Lane is
      # deprecation-slated with the 180731181784 retirement; keep this minimal.
      - name: Stage the samsite record (bootstrap pointer)
        if: matrix.line == 'samsite'
        run: |
          python3 -m tap.boot_pointer \
            'git+https://github.com/unified-systems-com/tap-plugin-samsite@v0.2.0#samsite' \
            --out boot

      # Boot THIS line's profile (preboot installs exactly that profile's plugins).
      - name: Boot the ${{ matrix.profile }} profile
        env:
          TAP_BOOT_PROFILE: ${{ matrix.profile }}
          TAP_BOOT_INSTALL__SNAPSHOT_BEFORE_MIGRATE: "false"
        run: |
          docker compose --env-file .env up -d
          ok=0
          for i in $(seq 1 90); do
            if docker compose --env-file .env logs web 2>/dev/null | grep -q 'TAP-ABORT:'; then
              echo "::error::boot aborted (TAP-ABORT sentinel in web log)"
              docker compose --env-file .env logs web; exit 1
            fi
            if docker compose --env-file .env exec -T web sh -c 'cd /app && uv run python manage.py health' >/dev/null 2>&1; then
              echo "web healthy after ~$((i * 10))s"; ok=1; break
            fi
            sleep 10
          done
          if [ "$ok" != 1 ]; then
            echo "::error::web did not become healthy within the timeout"
            docker compose --env-file .env logs web | tail -150; exit 1
          fi

      # Cold-resolve the staged samsite record against the stack it just booted:
      # schema + the required_secrets coherence rules + every seed slug/bundle and
      # collector key checked against the live registries — offline, secrets-free,
      # zero mutation (`boot --check`). This is the CORE-side half of the record-gate
      # seam (req-boot-bootstrap-samsite-rehome-4): the record's own shipped suite
      # runs in the plugin repo's CI on its cadence; this step catches the other
      # direction — a core/plugin-registry change that rots the record — on tap's
      # cadence. Population still never runs here (no collectors, empty secrets).
      - name: Cold-resolve the samsite record (boot --check)
        if: matrix.line == 'samsite'
        run: |
          docker compose --env-file .env exec -T web sh -c \
            'cd /app && uv run python manage.py boot --profile samsite --check'

      # Build the per-profile template DB workers clone from. Honors the booted profile's
      # installed app set (entry-point discovery), so the template schema matches the run.
      - name: Build per-profile test-DB template
        run: docker compose --env-file .env exec -T web sh -c 'cd /app && TAP_TEST_DB_TEMPLATE=tap_test_template scripts/build-test-template'

      # This line's tests. install-aware collection (req-dev-validation-collection-complete)
      # runs core + the booted profile's plugin tests. Worker DBs clone the template.
      - name: Test lane — ${{ matrix.line }}
        run: docker compose --env-file .env exec -T web sh -c 'cd /app && TAP_TEST_DB_TEMPLATE=tap_test_template uv run pytest -n 8'

      - name: Dump web logs on failure
        if: failure()
        run: docker compose --env-file .env logs web | tail -200

  # The single stable required-check target — rulesets point ONLY at this name.
  # The matrix names its `line` instances from matrix DATA ("line (test_all, ...)"),
  # so those names silently change whenever the matrix shape changes; requiring them
  # directly leaves the ruleset pinned to strings that stop reporting. This job has a
  # hand-chosen name and one opinion. `if: always()` means it cannot be skipped into
  # a false green (GitHub treats a skipped required check as satisfied — fail-open);
  # it demands `success` specifically, so skipped/cancelled upstream jobs FAIL the
  # gate. Sibling of all-plugins.yml's `all-plugins-gate`, same convention.
  gate:
    needs: [setup, secret-scan, line]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every required job must have actually succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "::error::a required job finished '$r' (skipped counts as failure here)"; exit 1; }
          done
